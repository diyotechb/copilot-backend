# assemblyai.api-key is required in environment or here
assemblyai.api-key=${ASSEMBLY_AI_API_KEY}

# Expose minimal actuator endpoints for platform health checks
management.endpoints.web.exposure.include=health,info,prometheus
# Show health details only when explicitly requested (keep minimal by default)
management.endpoint.health.show-details=when_authorized
# Enable Prometheus actuator endpoint and metrics export
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
